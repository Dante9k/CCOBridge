services:
  ccobridge:
    image: ccobridge:1.2.0
    container_name: ccobridge
    network_mode: host
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./config:/etc/ccobridge:ro
      - ./data:/var/lib/ccobridge
    environment:
      GATEWAY_HOST: 0.0.0.0
      GATEWAY_PORT: "4000"
      INTERNAL_LITELLM_PORT: "4001"
      CCOBRIDGE_KEYS_FILE: /etc/ccobridge/users.json
      CCOBRIDGE_USAGE_DB: /var/lib/ccobridge/usage.sqlite3
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4000/health/liveliness', timeout=3).read()"
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 4

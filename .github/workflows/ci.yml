name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality and unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install development tools
        run: python3 -m pip install --disable-pip-version-check ruff==0.16.3

      - name: Lint and check formatting
        run: |
          python3 -m ruff check .
          python3 -m ruff format --check .

      - name: Run unit tests
        env:
          PYTHONPATH: .
        run: python3 -m unittest discover -s tests -p 'test_*.py'

      - name: Check shell scripts
        run: shellcheck client/*.sh deploy/*.sh scripts/build-offline.sh tests/*.sh

      - name: Check PowerShell helper
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module PSScriptAnalyzer -RequiredVersion 1.25.0 -Scope CurrentUser -Force
          $issues = Invoke-ScriptAnalyzer -Path client/claude-ccobridge.ps1 -Severity Warning,Error
          $issues | Format-Table -AutoSize
          if ($issues) { exit 1 }

      - name: Scan publication candidates
        run: python3 scripts/check-public-release.py

      - name: Validate Compose configuration
        shell: bash
        run: |
          set -Eeuo pipefail
          cp deploy/env.example deploy/.env
          trap 'rm -f deploy/.env' EXIT
          docker compose -f deploy/compose.yaml config --quiet
